{% if page.url contains 'contact' %}
  <script>
    const contactForm = document.getElementById("contactForm");
    const submitButton = document.getElementById("sendMessageButton");
    const formStatus = document.getElementById("formStatus");

    contactForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      submitButton.disabled = true;
      submitButton.textContent = "Sending...";
      formStatus.dataset.state = "sending";
      formStatus.textContent = "Sending your message.";

      try {
        const response = await fetch(contactForm.action, {
          method: "POST",
          body: new FormData(contactForm),
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error("Form submission failed");
        }

        contactForm.reset();
        formStatus.dataset.state = "success";
        formStatus.textContent = "Your message has been sent. Thank you.";
      } catch (error) {
        formStatus.dataset.state = "error";
        formStatus.textContent = "Your message could not be sent. Please check your connection and try again.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send message";
      }
    });
  </script>
{% endif %}
